<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Loja do Vinho</title><style>
:root{--vinho:#5C061A;--dourado:#D4AF37;--fundo:#FDFBF7;--verde:#25D366}*{box-sizing:border-box}body{margin:0;background:var(--fundo);font-family:Segoe UI,Arial;color:#2c2c2c}header{background:linear-gradient(135deg,#3a020f,var(--vinho));color:#fff;padding:22px 18px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:1.35rem}main{max-width:1100px;margin:22px auto;padding:0 15px}.barra{display:flex;gap:10px;flex-wrap:wrap;background:#fff;padding:15px;border-radius:12px;border:1px solid #eadfc2;box-shadow:0 3px 12px #0000000d}.barra input,.barra select{padding:10px;border:1px solid #ccc;border-radius:8px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.primario{background:var(--vinho);color:#fff}.verde{background:var(--verde);color:#fff}.cinza{background:#eee}.danger{background:#8b1e2d;color:#fff}.status{margin:12px 0;font-weight:700}.grid{display:grid;gap:14px;margin-top:15px}.pedido{background:#fff;border-radius:14px;border:1px solid #e5dfd3;padding:16px;box-shadow:0 3px 12px #0000000a}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.numero{font-size:1.2rem;font-weight:900;color:var(--vinho)}.badge{padding:5px 9px;border-radius:20px;background:#fff2c8;font-weight:800;font-size:.78rem}.badge.ok{background:#dff7e7;color:#176b39}.badge.cancel{background:#f8dfe3;color:#8b1e2d}.itens{margin:12px 0;padding-left:18px}.acoes{display:flex;gap:8px;flex-wrap:wrap}.meta{font-size:.9rem;color:#555;line-height:1.5}.total{font-size:1.15rem;font-weight:900;color:var(--vinho)}.login{max-width:430px;margin:60px auto;background:#fff;padding:24px;border-radius:14px;border:1px solid #eadfc2}.login input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}.oculto{display:none}
</style></head><body><header><h1>🍷 Loja do Vinho — Central de Pedidos Online</h1></header><main>
<section id="login" class="login"><h2>Acesso administrativo</h2><p>Digite o token configurado na API.</p><input id="token" type="password" placeholder="Token administrativo"><button class="btn primario" onclick="entrar()">Entrar</button><p id="loginMsg"></p></section>
<section id="painel" class="oculto"><div class="barra"><select id="filtro"><option value="">Todos</option><option value="AGUARDANDO_PAGAMENTO">Aguardando pagamento</option><option value="CONFIRMADO">Confirmados</option><option value="CANCELADO">Cancelados</option></select><button class="btn primario" onclick="carregar()">🔄 Atualizar</button><button class="btn cinza" onclick="sair()">Sair</button></div><div id="status" class="status"></div><div id="lista" class="grid"></div></section>
</main><script>
const API=window.LOJA_VINHO_API||location.origin;let token='';
function entrar(){token=document.getElementById('token').value.trim();if(!token){return}localStorage.setItem('loja_vinho_admin_token',token);document.getElementById('login').classList.add('oculto');document.getElementById('painel').classList.remove('oculto');carregar()}
function sair(){token='';localStorage.removeItem('loja_vinho_admin_token');location.reload()}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function carregar(){const st=document.getElementById('status'),lista=document.getElementById('lista');st.textContent='Carregando...';try{const status=document.getElementById('filtro').value;const r=await fetch(`${API}/api/admin/pedidos?limit=100${status?'&status='+encodeURIComponent(status):''}`,{headers:{'X-Admin-Token':token}});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.erro||'Erro');st.textContent=`${d.pedidos.length} pedido(s)`;lista.innerHTML=d.pedidos.map(p=>card(p)).join('')||'<div class="pedido">Nenhum pedido encontrado.</div>'}catch(e){st.textContent='❌ '+e.message;if(/401|Não autorizado/i.test(e.message)){document.getElementById('login').classList.remove('oculto');document.getElementById('painel').classList.add('oculto')}}}
function card(p){let badge=p.status==='CONFIRMADO'?'ok':p.status==='CANCELADO'?'cancel':'';let itens=(p.itens||[]).map(i=>`<li>${i.quantidade}x ${esc(i.nome)} — R$ ${Number(i.subtotal).toFixed(2).replace('.',',')}</li>`).join('');let botoes=p.status==='AGUARDANDO_PAGAMENTO'?`<button class="btn verde" onclick="acao(${p.id},'confirmar')">✅ Confirmar pagamento e faturar</button><button class="btn danger" onclick="acao(${p.id},'cancelar')">❌ Cancelar</button>`:'';return `<article class="pedido"><div class="top"><div><div class="numero">Pedido #${p.id}</div><div class="meta">${esc(p.criado_em||'')}</div></div><span class="badge ${badge}">${esc(p.status)}</span></div><div class="meta"><b>Cliente:</b> ${esc(p.cliente||'Não informado')}<br><b>Endereço:</b> ${esc(p.endereco||'Não informado')}<br><b>Bairro:</b> ${esc(p.bairro||'A combinar')}<br><b>Pagamento:</b> ${esc(p.forma_pagamento||'')}</div><ul class="itens">${itens}</ul><div class="total">Total: R$ ${Number(p.total||0).toFixed(2).replace('.',',')}</div><div class="acoes">${botoes}</div></article>`}
async function acao(id,op){const msg=op==='confirmar'?`Confirmar o pagamento do pedido #${id}? Isso criará a venda no PDV e baixará o estoque.`:`Cancelar o pedido #${id}?`;if(!confirm(msg))return;try{const r=await fetch(`${API}/api/admin/pedidos/${id}/${op}`,{method:'PUT',headers:{'X-Admin-Token':token}});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.erro||'Erro');alert(op==='confirmar'?`Pedido #${id} faturado. Venda nº ${d.venda_id}.`:`Pedido #${id} cancelado.`);carregar()}catch(e){alert('❌ '+e.message)}}
(function(){const t=localStorage.getItem('loja_vinho_admin_token');if(t){token=t;document.getElementById('token').value=t;document.getElementById('login').classList.add('oculto');document.getElementById('painel').classList.remove('oculto');carregar()}})();
</script></body></html>
